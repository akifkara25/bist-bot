name: BIST V3 Pro Scanner

on:
  schedule:
    - cron: '5 7 * * 1-5'
    - cron: '5 10 * * 1-5'
    - cron: '5 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bist-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Kopyala
      uses: actions/checkout@v3

    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy requests

    - name: Botu Çalıştır
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python main.py

    - name: Veritabanını Kaydet
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add signals_v9_trend_pullback.db
        git diff --staged --quiet || git commit -m "DB güncelleme"
        git push
