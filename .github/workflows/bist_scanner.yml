name: BIST Tarama

on:
  schedule:
    # Cron UTC'dir. Türkiye UTC+3'te sabit (DST yok).
    # 06:45 UTC = 09:45 TRT -> Açılış öncesi özet (önceki kapanışa göre)
    - cron: "45 6 * * 1-5"
    # 15:30 UTC = 18:30 TRT -> Ana tarama (kapanış sonrası, günlük mum kapanmış)
    - cron: "30 15 * * 1-5"
  workflow_dispatch: {}   # Manuel tetikleme için

permissions:
  contents: write   # state.json'u geri commit'leyebilmek için gerekli

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Taramayı çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: state.json değişikliğini commit'le
        run: |
          git config user.name "bist-scanner-bot"
          git config user.email "actions@github.com"
          if [ -f state.json ]; then
            git add state.json
            git diff --cached --quiet || git commit -m "state güncellendi [skip ci]"
            git push
          else
            echo "state.json bulunamadı — script bunu oluşturmamış olabilir, commit atlanıyor."
          fi
