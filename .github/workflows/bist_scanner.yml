name: BIST Tarama

on:
  schedule:
    # Cron UTC'dir. Türkiye UTC+3'te sabit (DST yok).
    # 08:05 UTC = 11:05 TRT -> Açılıştan (10:00) ~1 saat sonra
    - cron: "5 8 * * 1-5"
    # 14:05 UTC = 17:05 TRT -> Kapanışa ~1 saat kala (piyasa hâlâ açık)
    - cron: "5 14 * * 1-5"
    # 15:30 UTC = 18:30 TRT -> Ana tarama (kapanış sonrası, günlük mum kapanmış)
    - cron: "30 15 * * 1-5"
  workflow_dispatch: {}   # Manuel tetikleme için

permissions:
  contents: write   # state.json'u geri commit'leyebilmek için gerekli

# YENİ: Aynı anda birden fazla tarama çalışmasını engeller. Bu olmadan
# (ör. zamanlanmış tarama sürerken elle "Run workflow" dendiğinde) iki iş
# aynı state.json'a yazmaya çalışır ve biri diğerinin sonucunu ezebilir.
concurrency:
  group: bist-tarama
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # YENİ: Yahoo takılırsa iş sonsuza kadar asılı kalmasın

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip        # YENİ: bağımlılıkları önbelleğe alır, her run ~1 dk kazandırır

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Taramayı çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: state.json değişikliğini commit'le
        if: always()   # YENİ: tarama çökse bile, o ana kadar kaydedilmiş
                       # state (ör. kapatılmış pozisyonlar) commit'lensin.
                       # Aksi halde gönderilmiş bildirimler kaydedilmeden
                       # kaybolur ve bir sonraki turda TEKRAR gönderilir.
        run: |
          git config user.name "bist-scanner-bot"
          git config user.email "actions@github.com"
          if [ -f state.json ]; then
            git add state.json
            if git diff --cached --quiet; then
              echo "state.json değişmemiş, commit gerekmiyor."
            else
              git commit -m "state güncellendi [skip ci]"
              # YENİ: push başarısız olursa (ör. sen bu sırada main.py'yi
              # düzenlediysen) önce uzaktaki değişiklikleri alıp tekrar dene.
              # Bu olmadan push reddedilir ve tüm iş kırmızıya döner.
              git push || {
                echo "Push reddedildi, rebase ile tekrar deneniyor..."
                git pull --rebase --autostash
                git push
              }
            fi
          else
            echo "state.json bulunamadı — script bunu oluşturmamış olabilir, commit atlanıyor."
          fi
